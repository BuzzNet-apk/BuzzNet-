<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600"><defs>

    <linearGradient
        id="coverGradient"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="100%"
    >

        <stop
            offset="0%"
            stop-color="#08070d"
        />

        <stop
            offset="42%"
            stop-color="#171126"
        />

        <stop
            offset="72%"
            stop-color="#251653"
        />

        <stop
            offset="100%"
            stop-color="#8d5cff"
        />

    </linearGradient>


    <radialGradient
        id="goldGlow"
        cx="20%"
        cy="40%"
        r="55%"
    >

        <stop
            offset="0%"
            stop-color="#f1d78f"
            stop-opacity=".28"
        />

        <stop
            offset="100%"
            stop-color="#f1d78f"
            stop-opacity="0"
        />

    </radialGradient>


    <radialGradient
        id="purpleGlow"
        cx="85%"
        cy="65%"
        r="50%"
    >

        <stop
            offset="0%"
            stop-color="#8d5cff"
            stop-opacity=".48"
        />

        <stop
            offset="100%"
            stop-color="#8d5cff"
            stop-opacity="0"
        />

    </radialGradient>


    <linearGradient
        id="lineGradient"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="0%"
    >

        <stop
            offset="0%"
            stop-color="#d8b15a"
            stop-opacity="0"
        />

        <stop
            offset="50%"
            stop-color="#f1d78f"
            stop-opacity=".65"
        />

        <stop
            offset="100%"
            stop-color="#8d5cff"
            stop-opacity="0"
        />

    </linearGradient>

</defs>


<!-- Base -->

<rect
    width="1600"
    height="600"
    fill="url(#coverGradient)"
/>


<!-- Atmospheric glow -->

<rect
    width="1600"
    height="600"
    fill="url(#goldGlow)"
/>

<rect
    width="1600"
    height="600"
    fill="url(#purpleGlow)"
/>


<!-- Large decorative circles -->

<circle
    cx="250"
    cy="120"
    r="210"
    fill="none"
    stroke="#f1d78f"
    stroke-width="2"
    opacity=".12"
/>

<circle
    cx="250"
    cy="120"
    r="145"
    fill="none"
    stroke="#f1d78f"
    stroke-width="2"
    opacity=".08"
/>

<circle
    cx="1370"
    cy="470"
    r="270"
    fill="none"
    stroke="#8d5cff"
    stroke-width="2"
    opacity=".18"
/>

<circle
    cx="1370"
    cy="470"
    r="190"
    fill="none"
    stroke="#8d5cff"
    stroke-width="2"
    opacity=".11"
/>


<!-- Abstract diagonal lines -->

<path
    d="M-100 520 L600 -80"
    fill="none"
    stroke="url(#lineGradient)"
    stroke-width="3"
    opacity=".55"
/>

<path
    d="M250 650 L950 -50"
    fill="none"
    stroke="url(#lineGradient)"
    stroke-width="2"
    opacity=".35"
/>

<path
    d="M850 650 L1550 -50"
    fill="none"
    stroke="url(#lineGradient)"
    stroke-width="3"
    opacity=".38"
/>


<!-- Floating particles -->

<circle
    cx="460"
    cy="170"
    r="5"
    fill="#f1d78f"
    opacity=".55"
/>

<circle
    cx="760"
    cy="410"
    r="4"
    fill="#ffffff"
    opacity=".20"
/>

<circle
    cx="1060"
    cy="160"
    r="5"
    fill="#8d5cff"
    opacity=".65"
/>

<circle
    cx="1250"
    cy="320"
    r="3"
    fill="#f1d78f"
    opacity=".45"
/>

<circle
    cx="600"
    cy="500"
    r="3"
    fill="#8d5cff"
    opacity=".50"
/>


<!-- BuzzNet wordmark -->

<text
    x="800"
    y="325"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="92"
    font-weight="800"
    letter-spacing="8"
    fill="#ffffff"
    opacity=".90"
>BUZZNET</text>


<text
    x="800"
    y="375"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="600"
    letter-spacing="9"
    fill="#f1d78f"
    opacity=".75"
>CONNECT · DISCOVER · CREATE</text>


<!-- Bottom accent -->

<rect
    x="520"
    y="535"
    width="560"
    height="3"
    rx="2"
    fill="url(#lineGradient)"
/>

</svg>